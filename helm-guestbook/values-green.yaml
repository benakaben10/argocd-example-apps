fullnameOverride: green-guestbook
nameOverride: green-guestbook
image:
  repository: nginx
  tag: latest
description: This is Green version of Guestbook application

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: ingress-nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/canary-by-header: "X-Canary"
    nginx.ingress.kubernetes.io/canary-by-header-value: "green"
  path: /
  hosts:
    - host: guestbook.pb-ha.ifs.fcam.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: guestbook-tls
      hosts:
        - guestbook.pb-ha.ifs.fcam.vn