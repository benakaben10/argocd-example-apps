fullnameOverride: green-guestbook
nameOverride: green-guestbook
image:
  repository: nginx
  tag: latest
description: This is Green version of Guestbook application

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: ingress-nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/canary: "true"
    nginx.ingress.kubernetes.io/canary-by-header: "X-Real-IP"
    ngnginx.ingress.kubernetes.io/canary-by-header-pattern: "42.115.25.145"
    nginx.ingress.kubernetes.io/enable-modsecurity: "false"
    nginx.ingress.kubernetes.io/enable-owasp-core-rules: "false"
    nginx.ingress.kubernetes.io/modsecurity-transaction-id: "$request_id"
    nginx.ingress.kubernetes.io/configuration-snippet: |
       more_set_input_headers -r X-Forwarded-For $remote_addr;
       more_set_input_headers -r X-Real-Ip $remote_addr;
  path: /
  hosts:
    - host: guestbook.pb-ha.ifs.fcam.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: guestbook-tls
      hosts:
        - guestbook.pb-ha.ifs.fcam.vn