fullnameOverride: blue-guestbook
nameOverride: blue-guestbook
description: This is Blue version of Guestbook application
image:
  repository: benluu/debugger
  tag: net-debug-tools-0

ingress:
  enabled: true
  annotations:
    kubernetes.io/ingress.class: ingress-nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    cert-manager.io/cluster-issuer: letsencrypt-prod
  path: /
  hosts:
    - host: guestbook.pb-ha.ifs.fcam.vn
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: guestbook-tls
      hosts:
        - guestbook.pb-ha.ifs.fcam.vn